format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$php\
$rust\
$golang\
$ruby\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[character]
success_symbol = "[›](bold green)"
error_symbol = "[›](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
modified = "● "
staged = "+ "
untracked = "? "
stashed = "≡ "

[cmd_duration]
min_time = 2_000
format = " took [$duration](bold yellow)"

[nodejs]
format = " [$symbol($version )]($style)"
symbol = " "

[php]
format = " [$symbol($version )]($style)"
symbol = " "

[python]
format = " [$symbol($version )]($style)"
symbol = " "

[rust]
format = " [$symbol($version )]($style)"
symbol = " "

[golang]
format = " [$symbol($version )]($style)"
symbol = " "

[ruby]
format = " [$symbol($version )]($style)"
symbol = " "
